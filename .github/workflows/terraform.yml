name: Terraform (dev)

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'infra/**'
      - 'apps/backend/**'
      - '.github/workflows/terraform.yml'

permissions:
  id-token: write # REQUERIDO: habilita la emision del token OIDC
  contents: read # para el checkout

jobs:
  plan:
    name: fmt - validate - plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev # Apunta a dev - todos los run corren parados ahi (donde vive el backend). El step de fmt lo override a infra para chequear formato de todo el arbol (bootstrap + envs).
    steps:
      - uses: actions/checkout@v4

      # El artefacto de la Lambda (.deploy/backend) NO se commitea: es un build.
      # Hay que generarlo aca antes del plan, si no data.archive_file falla por
      # "missing directory". Corre en la raiz del repo (override del working-directory).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Build Lambda artifact
        run: pnpm --filter @wallet/backend build:lambda
        working-directory: ${{ github.workspace }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }} # usa la variable del repo, no un ARN hardcodeado.
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.7'

      - name: Format check (all infra)
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -no-color #  sin codigos de color, se lee mejor en los logs del CI.
